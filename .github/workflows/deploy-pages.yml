name: Compilar y publicar aplicación web

# Compila web/ y publica el resultado:
#  - En la rama "hostinger" (siempre): Hostinger → Avanzado → GIT con rama "hostinger" sirve el sitio estático.
#  - En GitHub Pages (opcional): crear la variable PUBLICAR_GITHUB_PAGES = true y activar Pages con "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Compilar aplicación web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Publicar en la rama hostinger
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          publish_branch: hostinger
          force_orphan: true
          commit_message: 'Sitio compilado'

      - uses: actions/upload-pages-artifact@v3
        if: vars.PUBLICAR_GITHUB_PAGES == 'true'
        with:
          path: web/dist

  deploy-github-pages:
    needs: build
    if: vars.PUBLICAR_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
